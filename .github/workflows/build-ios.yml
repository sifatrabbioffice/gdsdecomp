name: Build GDRecomp iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Disable Test Subdirectories Safely
        run: |
          git checkout .
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              if 'aot-test' in root.lower() and 'CMakeLists.txt' in files:
                  path = os.path.join(root, 'CMakeLists.txt')
                  print(f'Stubbing out test file: {path}')
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('# Disabled for iOS target build\n')
          "

      - name: Locate CMake and Configure
        run: |
          CMAKE_PATH=$(find . -maxdepth 3 -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          if [ -z "$CMAKE_PATH" ]; then
            echo "Error: CMakeLists.txt khunje pawa jayni!"
            exit 1
          fi
          SRC_DIR=$(dirname "$CMAKE_PATH")

          cmake -S "$SRC_DIR" -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_TESTS=OFF

      - name: Build Executable
        run: |
          cmake --build build-ios --config Release

      - name: Package .app to .ipa
        run: |
          python3 -c "
          import os, shutil, zipfile

          os.makedirs('Payload', exist_ok=True)
          app_path = None
          for root, dirs, files in os.walk('build-ios'):
              for d in dirs:
                  if d.endswith('.app'):
                      app_path = os.path.join(root, d)
                      break
              if app_path:
                  break

          if app_path:
              print(f'Found app bundle: {app_path}')
              shutil.copytree(app_path, os.path.join('Payload', os.path.basename(app_path)), dirs_exist_ok=True)
          else:
              print('No app bundle found. Packing binary files...')
              target_dir = os.path.join('Payload', 'GDRecomp.app')
              os.makedirs(target_dir, exist_ok=True)
              for root, dirs, files in os.walk('build-ios'):
                  for f in files:
                      p = os.path.join(root, f)
                      if os.access(p, os.X_OK) and not f.startswith('.'):
                          shutil.copy(p, target_dir)

          with zipfile.ZipFile('GDRecomp-iOS.ipa', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('Payload'):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, '.')
                      zipf.write(file_path, arcname)
          print('Successfully created GDRecomp-iOS.ipa')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDRecomp-iOS-IPA
          path: GDRecomp-iOS.ipa
