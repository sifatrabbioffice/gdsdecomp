name: Build GDRecomp iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Disable Test Subdirectories
        run: |
          find . -name "CMakeLists.txt" -exec sed -i '' -E 's/(add_subdirectory\(.*aot-test.*\)/# \1/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '' -E 's/(add_subdirectory\(.*test.*\)/# \1/g' {} + || true

      - name: Locate CMake and Configure
        run: |
          CMAKE_PATH=$(find . -maxdepth 3 -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          if [ -z "$CMAKE_PATH" ]; then
            echo "Error: CMakeLists.txt khunje pawa jayni!"
            exit 1
          fi
          SRC_DIR=$(dirname "$CMAKE_PATH")

          cmake -S "$SRC_DIR" -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_TESTS=OFF

      - name: Build Executable
        run: |
          cmake --build build-ios --config Release

      - name: Package .app to .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            mkdir -p Payload/GDRecomp.app
            find build-ios -maxdepth 2 -type f -executable -exec cp {} Payload/GDRecomp.app/ \;
          fi
          zip -r GDRecomp-iOS.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDRecomp-iOS-IPA
          path: GDRecomp-iOS.ipa
