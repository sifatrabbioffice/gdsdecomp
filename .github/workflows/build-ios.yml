name: Build GDRecomp iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Disable Test Subdirectories Safely
        run: |
          git checkout .
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              if 'aot-test' in root.lower() and 'CMakeLists.txt' in files:
                  path = os.path.join(root, 'CMakeLists.txt')
                  print(f'Stubbing out test file: {path}')
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('# Disabled for iOS target build\n')
          "

      - name: Locate CMake and Configure
        run: |
          CMAKE_PATH=$(find . -maxdepth 3 -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          if [ -z "$CMAKE_PATH" ]; then
            echo "Error: CMakeLists.txt khunje pawa jayni!"
            exit 1
          fi
          SRC_DIR=$(dirname "$CMAKE_PATH")

          cmake -S "$SRC_DIR" -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_TESTS=OFF

      - name: Build Executable
        run: |
          cmake --build build-ios --config Release

      - name: Create Valid iOS App Bundle & IPA
        run: |
          python3 -c "
          import os, shutil, zipfile, subprocess

          payload_dir = 'Payload'
          app_dir = os.path.join(payload_dir, 'GDRecomp.app')
          if os.path.exists(payload_dir):
              shutil.rmtree(payload_dir)
          os.makedirs(app_dir, exist_ok=True)

          # Mach-O executable search
          executable_file = None
          for root, dirs, files in os.walk('build-ios'):
              for f in files:
                  p = os.path.join(root, f)
                  try:
                      res = subprocess.run(['file', p], capture_output=True, text=True)
                      if 'Mach-O' in res.stdout and ('arm64' in res.stdout or 'executable' in res.stdout):
                          if not f.startswith('.') and not f.endswith('.dylib') and not f.endswith('.a'):
                              executable_file = p
                              break
                  except Exception:
                      pass
              if executable_file:
                  break

          if not executable_file:
              raise Exception('No iOS executable binary found in build-ios directory!')

          print(f'Main executable found: {executable_file}')
          target_exec = os.path.join(app_dir, 'GDRecomp')
          shutil.copy(executable_file, target_exec)
          os.chmod(target_exec, 0o755)

          # Copy dynamic libraries
          for root, dirs, files in os.walk('build-ios'):
              for f in files:
                  if f.endswith('.dylib'):
                      shutil.copy(os.path.join(root, f), app_dir)

          # Generate Info.plist
          info_plist_content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>GDRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sifat.gdrecomp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GDRecomp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>'''

          with open(os.path.join(app_dir, 'Info.plist'), 'w', encoding='utf-8') as f:
              f.write(info_plist_content.strip())

          # Zip Payload to .ipa
          ipa_name = 'GDRecomp-iOS.ipa'
          with zipfile.ZipFile(ipa_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(payload_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, '.')
                      zipf.write(file_path, arcname)

          print('Valid iOS IPA successfully generated.')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDRecomp-iOS-IPA
          path: GDRecomp-iOS.ipa
