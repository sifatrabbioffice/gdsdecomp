name: Build GDRecomp iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Disable Test Subdirectories Safely
        run: |
          git checkout .
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              if 'aot-test' in root.lower() and 'CMakeLists.txt' in files:
                  path = os.path.join(root, 'CMakeLists.txt')
                  print(f'Stubbing out test file: {path}')
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('# Disabled for iOS target build\n')
          "

      - name: Locate CMake and Configure
        run: |
          CMAKE_PATH=$(find . -maxdepth 3 -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
          if [ -z "$CMAKE_PATH" ]; then
            echo "Error: CMakeLists.txt khunje pawa jayni!"
            exit 1
          fi
          SRC_DIR=$(dirname "$CMAKE_PATH")

          cmake -S "$SRC_DIR" -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_TESTS=OFF

      - name: Build Executable
        run: |
          cmake --build build-ios --config Release

      - name: Construct Valid iOS App Bundle & IPA
        run: |
          python3 -c "
          import os, shutil, zipfile

          payload_dir = 'Payload'
          app_dir = os.path.join(payload_dir, 'GDRecomp.app')
          if os.path.exists(payload_dir):
              shutil.rmtree(payload_dir)
          os.makedirs(app_dir, exist_ok=True)

          # 1. Locate main executable binary
          binary_path = None
          for root, dirs, files in os.walk('build-ios'):
              for f in files:
                  p = os.path.join(root, f)
                  if os.access(p, os.X_OK) and not f.startswith('.') and not f.endswith(('.o', '.dylib', '.a', '.ninja', '.cmake', '.txt', '.json', '.dll', '.sh')):
                      binary_path = p
                      break
              if binary_path:
                  break

          if not binary_path:
              raise RuntimeError('Compiled iOS executable binary khunje pawa jayni!')

          print(f'Executable binary found: {binary_path}')
          dest_binary = os.path.join(app_dir, 'GDRecomp')
          shutil.copy(binary_path, dest_binary)
          os.chmod(dest_binary, 0o755)

          # 2. Copy dylib dependencies if available
          for root, dirs, files in os.walk('build-ios'):
              for f in files:
                  if f.endswith('.dylib'):
                      shutil.copy(os.path.join(root, f), app_dir)

          # 3. Generate valid iOS Info.plist
          info_plist_content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>GDRecomp</string>
              <key>CFBundleIdentifier</key>
              <string>com.sifat.gdrecomp</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GDRecomp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>'''

          with open(os.path.join(app_dir, 'Info.plist'), 'w', encoding='utf-8') as f:
              f.write(info_plist_content)

          # 4. Create IPA archive
          with zipfile.ZipFile('GDRecomp-iOS.ipa', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('Payload'):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, '.')
                      zipf.write(file_path, arcname)

          print('Successfully generated valid iOS App Bundle & IPA!')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDRecomp-iOS-IPA
          path: GDRecomp-iOS.ipa
